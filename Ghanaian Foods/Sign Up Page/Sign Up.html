<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ghanaian foods sign up page">
    <title> Ghanaian Foods Sign Up Page</title>
    <link rel="stylesheet" href="./Sign Up.css" />
  </head>
  <body>
   <div class="form-container">
    <form action="./Landing Page/Landing Page.html" method="POST">
     <h1>Create an  account</h1>
    
     <label for="name">
      Full Name
      <input type="text" id="name" name="name" placeholder="Enter your name"/>
     </label>

     <label for="email">
      Email
      <input type="email" id="email" name="email"/>
     </label>

     <label for="password">
      Password
     <input type="password" name="password" id="password" />
     </label>

     <a href="./Landing Page/Landing Page.html" target="_blank"><button type="submit">Submit</button></a>

     <div class="sign-in-option">
      <p>Already have an account? <a href="" target="_blank">Sign in</a></p>
      <p><a href=" " target="_blank">Terms and Conditions</a></p>
     </div>
     
    </form>
    <div class="form-img">
    </div>
        
   </div>
  </body>
</html>
